# Builds the Windows installer (signed when signing secrets are configured) and the
# Microsoft Store package. Runs when you push a tag like v1.0.1, or manually.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

      - name: Build installer (signed if Azure Artifact Signing secrets exist)
        run: npm run dist
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_SIGNING_CERT_PROFILE }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_SIGNING_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build Microsoft Store package
        run: npm run dist:store

      - uses: actions/upload-artifact@v4
        with:
          name: face-guard-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.appx

      # The installer goes on the GitHub release; the .appx is uploaded to Partner Center by hand.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/FaceGuard-Setup-*.exe
